name: Set packages public
on: workflow_dispatch
permissions:
  packages: write
  contents: read
jobs:
  visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Public visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for pkg in typescript-config eslint-config; do
            echo "=== $pkg ==="
            # After repo is public, try connecting + visibility
            gh api --method PUT "orgs/everybenefits/packages/npm/${pkg}/repo/everybenefits/pulse-tooling"
            # npm unpublish/republish won't help; change via UI alternative:
            # Use GraphQL UpdatePackage for visibility - try PackageMetadata
            gh api graphql -f query='
              mutation {
                updatePackage(input: {clientMutationId: "1"}) { clientMutationId }
              }' 2>&1 | head -5
            gh api "orgs/everybenefits/packages/npm/${pkg}" --jq '{name,visibility,repository:.repository}'
          done
