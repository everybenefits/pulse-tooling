name: Grant package access
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  packages: write
  contents: read
jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: Grant sibling repos read access to tooling packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPOS=(
            pulse-shared pulse-firebase-web pulse-sso pulse-oidc pulse-chrome
            pulse-web pulse-studio pulse-admin pulse-payments pulse-developers
            pulse-legal pulse-backend pulse-mobile pulse-tooling pulse-ui
          )
          for pkg in typescript-config eslint-config; do
            for repo in "${REPOS[@]}"; do
              RID=$(gh api "repos/everybenefits/${repo}" --jq .id)
              echo "Grant $pkg -> $repo (id=$RID)"
              # Try both path styles
              gh api --method PUT \
                "orgs/everybenefits/packages/npm/${pkg}/repos/${RID}" \
                && echo "  ok repos/id" || echo "  fail repos/id"
              gh api --method PUT \
                "orgs/everybenefits/packages/npm/${pkg}/repositories/${RID}" \
                && echo "  ok repositories/id" || echo "  fail repositories/id"
            done
          done
