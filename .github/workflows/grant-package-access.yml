name: Grant package access
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  packages: write
  contents: read
jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: Grant sibling repos read access to tooling packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          declare -A REPOS=(
            [pulse-shared]=1384319123
            [pulse-firebase-web]=1384319158
            [pulse-sso]=1384319204
            [pulse-oidc]=1384319249
            [pulse-chrome]=1384319288
            [pulse-web]=1384319347
            [pulse-studio]=1384319381
            [pulse-admin]=1384319417
            [pulse-payments]=1384319450
            [pulse-developers]=1384319481
            [pulse-legal]=1384319507
            [pulse-backend]=1384319560
            [pulse-mobile]=1384319534
            [pulse-tooling]=1384319319
            [pulse-ui]=1382527459
          )
          for pkg in typescript-config eslint-config; do
            for repo in "${!REPOS[@]}"; do
              RID=${REPOS[$repo]}
              echo "Grant $pkg -> $repo ($RID)"
              out=$(gh api --method PUT "orgs/everybenefits/packages/npm/${pkg}/repos/${RID}" 2>&1)
              echo "  repos: $out"
            done
          done
          exit 0
