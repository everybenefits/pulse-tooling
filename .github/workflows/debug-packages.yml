name: Debug packages
on: workflow_dispatch
permissions:
  packages: write
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect package + try alternate grant APIs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for pkg in typescript-config eslint-config; do
            echo "======== $pkg ========"
            gh api "orgs/everybenefits/packages/npm/${pkg}" 
            echo
            echo "--- versions ---"
            gh api "orgs/everybenefits/packages/npm/${pkg}/versions" --jq '.[0]|{name,id}'
            echo "--- try package-permissions ---"
            # Documented endpoints
            RID=1384319123
            curl -sS -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/everybenefits/packages/npm/${pkg}/repos/${RID}" 
            echo
            # Link package to repository (maybe missing link?)
            curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/everybenefits/packages/npm/${pkg}/repos"
            echo
          done
