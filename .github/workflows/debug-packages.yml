name: Debug packages
on: workflow_dispatch
permissions:
  packages: read
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List org packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api 'orgs/everybenefits/packages?package_type=npm' --paginate || true
          echo "--- user ---"
          gh api 'user/packages?package_type=npm' --paginate || true
          echo "--- repo packages ---"
          gh api 'repos/everybenefits/pulse-tooling/packages' || true
